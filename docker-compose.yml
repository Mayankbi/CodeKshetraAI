services:
  # ─── Grafana: Dashboards & Visualization ────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: codekshetra-grafana
    ports:
      - "3001:3000" # Host 3001 → Container 3000 (avoids conflict with app ports)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-storage:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability
    restart: unless-stopped

  # ─── Loki: Log Aggregation ──────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: codekshetra-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - observability
    restart: unless-stopped

  # ─── OpenTelemetry Collector: Trace Ingestion ───────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: codekshetra-otel-collector
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    # Note: The OTel collector contrib image is a minimal scratch container
    # with no shell, curl, or wget. The health_check extension runs on :13133
    # and can be verified from the host: curl http://localhost:13133/
    # The collector logs "Everything is ready" on successful startup.
    networks:
      - observability
    restart: unless-stopped

  # ─── Prometheus: Metrics Collection ─────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: codekshetra-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - observability
    restart: unless-stopped

volumes:
  grafana-storage:

networks:
  observability:
    driver: bridge
